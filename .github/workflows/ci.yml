name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      # 编码与 pyc 纪律（方法论环境坑：子进程/CI 的编码通路独立加固）
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke (python -m form)
        run: python -m bill_reconciler selftest
      - name: CLI smoke (console script form)
        run: brc --version
