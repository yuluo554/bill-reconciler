name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 显式 include：3.8 腿钉 ubuntu-22.04（ubuntu-latest 自 2026-10-19 起迁移 Ubuntu 26，
        # 3.8 是否仍可跑属未验证，钉旧镜像规避）；3.12 腿跑 ubuntu-latest 覆盖新镜像。
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    env:
      # 编码与 pyc 纪律（方法论环境坑：子进程/CI 的编码通路独立加固）
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke (python -m form)
        run: python -m bill_reconciler selftest
      - name: CLI smoke (console script form)
        run: brc --version
